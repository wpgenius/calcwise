name: Linked issue

# Every change starts with an issue: a pull request must close at least one
# issue in this repo ("Closes #12" in its description). The release changelog
# is built from those issues. The "Protect main" ruleset makes this check
# required; Dependabot PRs pass automatically and repo admins can bypass.
#
# PRs into another branch (e.g. milestone/1.1): GitHub links closing issues
# only for PRs into the default branch, so the "Closes #N" lines are read from
# the description instead and each number is checked to be an issue here.
#
# Don't want this rule? Set the repo variable REQUIRE_LINKED_ISSUE to "false"
# (bin/setup-github.sh --linked-issue off does it). The check then always
# passes, and the changelog uses pull request titles instead of issue titles.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  pull-requests: read
  issues: read

jobs:
  linked-issue:
    name: Linked issue
    runs-on: ubuntu-latest
    steps:
      - name: Check that the PR closes an issue
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          REQUIRED: ${{ vars.REQUIRE_LINKED_ISSUE }}
          BASE: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          if [ "$REQUIRED" = "false" ]; then
            echo "REQUIRE_LINKED_ISSUE is false: no issue needed."
            exit 0
          fi
          if [ "$AUTHOR" = "dependabot[bot]" ]; then
            echo "Dependabot PR: no issue needed."
            exit 0
          fi
          if [ "$BASE" != "$DEFAULT_BRANCH" ]; then
            issues=""
            for n in $(printf '%s' "${BODY:-}" | grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]+#[0-9]+' | grep -oE '[0-9]+$' | sort -un); do
              line=$(gh api "repos/$GITHUB_REPOSITORY/issues/$n" --jq 'select(.pull_request == null) | "#\(.number) \(.title)"' 2>/dev/null || true)
              if [ -n "$line" ]; then issues="$issues$line"$'\n'; fi
            done
            issues=${issues%$'\n'}
          else
          issues=$(gh api graphql -F owner="${GITHUB_REPOSITORY%/*}" -F name="${GITHUB_REPOSITORY#*/}" -F pr="$PR" -f query='
            query($owner: String!, $name: String!, $pr: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $pr) {
                  closingIssuesReferences(first: 50) { nodes { number title } }
                }
              }
            }' --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[] | "#\(.number) \(.title)"')
          fi
          if [ -z "$issues" ]; then
            echo "::error::This pull request does not close any issue. Create an issue for the change and add 'Closes #<number>' to the PR description (one line per issue)."
            exit 1
          fi
          echo "Closes:"
          echo "$issues"
